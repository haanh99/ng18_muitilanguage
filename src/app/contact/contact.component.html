<section class="container py-5 h-100">
  <div class="row">
    <div class="col-md-6">
      <h2 class="display-4" translate="contact.title"></h2>
      <p class="mb-4" translate="contact.description"></p>
      <p>
        <strong translate="contact.email_label"></strong> <br />
        example&#64;example.com
      </p>
      <p>
        <strong translate="contact.phone_label"></strong> <br />
        (123) 456-7890
      </p>
    </div>
    <div class="col-md-6">
      <h2 translate="contact.send_message_title"></h2>
      <form >
        <!-- Name Input -->
        <div class="form-floating mb-3">
          <input
            class="form-control"
            id="name"
            type="text"
            placeholder="{{ 'contact.name_placeholder' | translate }}"
            data-sb-validations="required"
          />
          <label for="name">{{ 'contact.name_placeholder' | translate }}</label>
          <div class="invalid-feedback" data-sb-feedback="name:required">
            Name is required.
          </div>
        </div>

        <!-- Email Input -->
        <div class="form-floating mb-3">
          <input
            class="form-control"
            id="emailAddress"
            type="email"
            placeholder="{{ 'contact.email_placeholder' | translate }}"
            data-sb-validations="required,email"
          />
          <label for="emailAddress" translate="contact.email_placeholder"></label>
          <div
            class="invalid-feedback"
            data-sb-feedback="emailAddress:required"
          >
            Email Address is required.
          </div>
          <div class="invalid-feedback" data-sb-feedback="emailAddress:email">
            Email Address Email is not valid.
          </div>
        </div>

        <!-- Message Input -->
        <div class="form-floating mb-3">
          <textarea
            class="form-control"
            id="message"
            type="text"
            placeholder="{{ 'contact.message_placeholder' | translate }}"
            style="height: 10rem"
            data-sb-validations="required"
          ></textarea>
          <label translate="contact.message_placeholder"></label>
          <div class="invalid-feedback" data-sb-feedback="message:required">
            Message is required.
          </div>
        </div>

        <!-- Submit success message -->
        <div class="d-none" id="submitSuccessMessage">
          <div class="text-center mb-3">
            <div class="fw-bolder">Form submission successful!</div>
            <p>To activate this form, sign up at</p>
            <a href="https://startbootstrap.com/solution/contact-forms"
              >https://startbootstrap.com/solution/contact-forms</a
            >
          </div>
        </div>

        <!-- Submit error message -->
        <div class="d-none" id="submitErrorMessage">
          <div class="text-center text-danger mb-3">Error sending message!</div>
        </div>

        <!-- Submit button -->
        <div class="d-grid">
          <button
            class="btn btn-primary btn-lg disabled"
            id="submitButton"
            type="submit"
          >
            Submit
          </button>
        </div>
      </form>
    </div>
  </div>
</section>
