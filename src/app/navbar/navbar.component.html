<nav class="navbar navbar-expand-lg bg-body-tertiary sticky-top" data-bs-theme="dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">Giang--HD</a>
    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#navbarSupportedContent"
      aria-controls="navbarSupportedContent"
      aria-expanded="false"
      aria-label="Toggle navigation"
    >
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a
            class="nav-link active"
            aria-current="page"
            routerLink="/"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
            >{{ 'navbar.home' | translate }}</a
          >
        </li>
        <li class="nav-item">
          <a
            class="nav-link"
            routerLink="/about"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
            >{{ 'navbar.about' | translate }}</a
          >
        </li>

        <li class="nav-item">
          <a
            class="nav-link"
            routerLink="/contact"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
            >{{ 'navbar.contact' | translate }}</a
          >
        </li>      
      </ul>
      <div>
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item dropdown">
            <button
              class="btn btn-secondary dropdown-toggle"
              href="#"
              role="button"
              data-bs-toggle="dropdown"
              aria-expanded="true"
            >
              <span class="fi " [ngClass]="getLanguageIconClass(multiLanguage.languageSignal())"></span> 
              {{getLanguageName(multiLanguage.languageSignal())}}
            </button>
            <ul class="dropdown-menu">
              @for (item of languages; track $index) {
                <li>
                <a class="dropdown-item" (click)="toggleLanguage(item)"
                
                  ><span class="fi fi-{{item}}"></span> {{item}}</a
                >
              </li>
              }
              
              <!-- <li>
                <a class="dropdown-item" href="#"
                  ><span class="fi fi-vn"></span> VietName</a
                >
              </li>
              <li>
                <hr class="dropdown-divider" />
              </li>
              <li>
                <a class="dropdown-item" href="#"
                  ><span class="fi fi-de"></span> Germany</a
                >
              </li> -->
            </ul>
          </li>
        </ul>
      </div>
    </div>
  </div>
</nav>
